name: Dependency audit

# Fails when a production dependency has a known high/critical advisory.
# Runs on every push and PR, plus weekly so newly-published advisories
# surface even when nothing changes. Fixes go in the pnpm.overrides block
# of the root package.json (bump the range to the patched version).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from the packageManager field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies (high+)
        run: pnpm audit --prod --audit-level high
